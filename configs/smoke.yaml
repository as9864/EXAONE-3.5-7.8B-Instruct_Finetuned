# 파이프라인 검증용 초소형 실행 (수 분 내 완료).
# 학습 품질이 목적이 아니라 "끝까지 도는지" 확인용입니다.
#   python -m exaone_summarize.train -c configs/smoke.yaml

model:
  model_name_or_path: LGAI-EXAONE/EXAONE-3.5-7.8B-Instruct
  trust_remote_code: true
  attn_implementation: sdpa
  torch_dtype: bfloat16
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true
  gradient_checkpointing: true

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: null

data:
  train_file: data/sample/train.jsonl
  eval_file: data/sample/validation.jsonl
  max_seq_len: 1536
  max_target_tokens: 256
  num_proc: 1

train:
  output_dir: outputs/smoke
  num_train_epochs: 1.0
  max_steps: 4
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  warmup_ratio: 0.0
  optim: paged_adamw_8bit
  bf16: true
  logging_steps: 1
  eval_strategy: steps
  eval_steps: 4
  save_strategy: "no"
  load_best_model_at_end: false

generation:
  max_new_tokens: 200
  do_sample: false
